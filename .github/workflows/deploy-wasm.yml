name: Verify HackerOS WASM

on:
  push:
    branches: [ "main", "Wasm" ]
    paths: [ 'wasm2/HackerOs/**', '.github/workflows/deploy-wasm.yml' ]
  pull_request:
    paths: [ 'wasm2/HackerOs/**', '.github/workflows/deploy-wasm.yml' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "verify-hackeros-wasm-${{ github.ref }}"
  cancel-in-progress: true

env:
  HACKEROS_SOLUTION_DIR: wasm2/HackerOs
  HACKEROS_ARTIFACT_DIR: wasm2/HackerOs/artifacts

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Pack local Windowing/Taskbar feed
        working-directory: ${{ env.HACKEROS_SOLUTION_DIR }}
        run: >-
          dotnet pack Platform/HackerOs.Windowing.Core/HackerOs.Windowing.Core.csproj
          --configuration Release --output artifacts/local-nupkg &&
          dotnet pack Platform/HackerOs.Windowing.Blazor/HackerOs.Windowing.Blazor.csproj
          --configuration Release --output artifacts/local-nupkg &&
          dotnet pack Platform/HackerOs.Taskbar.Blazor/HackerOs.Taskbar.Blazor.csproj
          --configuration Release --output artifacts/local-nupkg

      - name: Restore solution
        working-directory: ${{ env.HACKEROS_SOLUTION_DIR }}
        run: dotnet restore HackerOs.sln

      - name: Build Release with warnings as errors
        working-directory: ${{ env.HACKEROS_SOLUTION_DIR }}
        run: dotnet build HackerOs.sln --configuration Release --no-restore

      - name: Install Razor source scan tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Verify production Razor assets
        working-directory: ${{ env.HACKEROS_SOLUTION_DIR }}
        shell: pwsh
        run: |
          # Only the bootstrap host is exempt. Allow these exact existing ASP.Hack
          # script links, while still scanning every other line in those views.
          $sourceMatches = rg --pcre2 -n '<style|<script|\sstyle\s*=|(?<!@)\bon[a-z][a-z0-9_-]*\s*=' . -g '*.razor' -g '!Tests/RazorAssetValidation.Invalid/**' -g '!test/test/Components/App.razor'
          $scanExitCode = $LASTEXITCODE
          if ($scanExitCode -gt 1) { throw 'Razor source scan failed.' }
          $allowedScriptLines = @{
            './Apps/Samples/HackerOs.Samples.Intranet/Views/Notes/Index.razor' = '<script src="@Url.Content("~/js/notes.js")"></script>'
            './Tests/HackerOs.AppSdk.Web.Tests/Views/Pages/Index.razor' = '<script src="@Url.Content("~/js/notes.js")"></script>'
            './Tests/HackerOs.AppSdk.Web.Tests/Views/Cshtml/FromRazor.razor' = '<HackSection Name="Scripts"><script src="/js/from-razor.js"></script></HackSection>'
          }
          $violations = @($sourceMatches | Where-Object {
            $sourceMatch = [regex]::Match($_, '^(?<path>.*?\.razor):\d+:(?<markup>.*)$')
            $sourcePath = $sourceMatch.Groups['path'].Value.Replace('\', '/')
            -not ($sourceMatch.Success -and $allowedScriptLines.ContainsKey($sourcePath) -and
              $allowedScriptLines[$sourcePath] -ceq $sourceMatch.Groups['markup'].Value.Trim())
          })
          if ($violations.Count -gt 0) {
            $violations
            throw 'Forbidden inline Razor asset markup was found.'
          }
          exit 0

      - name: Check vulnerable dependencies
        working-directory: ${{ env.HACKEROS_SOLUTION_DIR }}
        run: dotnet list HackerOs.sln package --vulnerable --include-transitive --no-restore

      - name: Test Release without browser suites
        working-directory: ${{ env.HACKEROS_SOLUTION_DIR }}
        shell: pwsh
        run: ./build/run-test-suite.ps1 -Suite NonBrowser

      - name: Publish HackerOS PWA
        working-directory: ${{ env.HACKEROS_SOLUTION_DIR }}
        run: >-
          dotnet publish OS/HackerOs.Ecosystem/HackerOs.Ecosystem.csproj
          --configuration Release
          --no-restore
          --output artifacts/publish

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hackeros-verification-${{ github.run_attempt }}
          path: |
            wasm2/HackerOs/artifacts/test-results
            wasm2/HackerOs/artifacts/playwright
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verified WASM publish
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hackeros-wasm-publish-${{ github.run_attempt }}
          path: wasm2/HackerOs/artifacts/publish/wwwroot
